# About Dialog
about.window_title=О pplaneX
about.description=Двумерный анализ фазовой плоскости и моделирование\n\n• Вдохновлено классическим инструментом pplane Джона Ч. Полкинга.\n• Адаптивное численное интегрирование ОДУ методами Рунге-Кутты.\n• Локальный анализ равновесия, собственные значения и матрица Якоби.\n• Интерактивное построение сепаратрис, орбит и нуль-изоклин.\n• Экспорт в чистый вектор (SVG) и растр высокого разрешения с альфа-каналом (PNG RGBA).
btn.close=Закрыть

