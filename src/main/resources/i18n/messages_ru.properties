# Predefined Models - Names and Descriptions
model.vanderpol.name=Осциллятор Ван дер Поля
model.vanderpol.desc=Автоколебательная система с нелинейным затуханием, демонстрирующая устойчивый релаксационный предельный цикл.
model.pendulum.name=Нелинейный маятник с трением
model.pendulum.desc=Движение маятника с вязким трением. Демонстрирует фокусы-аттракторы и седловые точки на гомоклинических/гетероклинических сепаратрисах.
model.duffing.name=Осциллятор Дуффинга (Автономный)
model.duffing.desc=Бистабильная система с потенциалом в виде двойной ямы. Иллюстрирует конкуренцию между двумя бассейнами притяжения.
model.lotka.name=Хищник-жертва (Лотка-Вольтерра)
model.lotka.desc=Каноническая консервативная модель хищник-жертва. Траектории образуют замкнутые периодические орбиты в первом квадранте.
model.murray.name=Конкуренция двух видов (Мюррей)
model.murray.desc=Логистическая модель с перекрестными условиями конкуренции по Джеймсу Мюррею. В зависимости от параметров иллюстрирует устойчивое сосуществование или конкурентное исключение.
model.fitzhugh.name=Нейрон ФитцХью-Нагумо
model.fitzhugh.desc=Двумерное упрощение модели Ходжкина-Хаксли для динамики потенциалов действия и возбудимости нейронов.
model.stommel.name=Термохалинная циркуляция Стоммела
model.stommel.desc=Модель двух резервуаров Стоммела для глубоководной конвекции (AMOC). Демонстрирует бистабильность и климатические точки невозврата.
model.kaldor.name=Нелинейный бизнес-цикл Калдора
model.kaldor.desc=Макроэкономическая динамика дохода (Y) и запаса капитала (K) с сигмовидной нелинейной инвестиционной функцией, генерирующей эндогенные циклы.
model.sir.name=Эпидемия SIR (Кермак-МакКендрик)
model.sir.desc=Классическая эпидемиологическая модель Кермака-МакКендрика (1927). Описывает распространение патогена с постоянным иммунитетом в безразмерных долях популяции (S + I + R = 1).
model.polking_classic.name=Классический Pplane (Полкинг)
model.polking_classic.desc=Полиномиальная система из оригинальной версии MATLAB pplane Джона Полкинга.
model.polking_multiple.name=Полкинг: Множественные равновесия
model.polking_multiple.desc=Классический пример Джона Полкинга (PPLANE/Rice). Содержит 4 одновременные точки равновесия, иллюстрируя сепаратрисы и границы бассейнов.
model.strogatz_love.name=2D Линейные системы (Классификация и Любовь Строгаца)
model.strogatz_love.desc=Линейная модель взаимной привязанности Стивена Строгаца. Показывает спиральные орбиты, ведущие к эмоциональной апатии или неизбежным циклам любовных романов.
model.brusselator.name=Химический осциллятор Брюсселятор
model.brusselator.desc=Автокаталитическая реакция Пригожина и Лефевра. Демонстрирует суперкритическую бифуркацию Андронова-Хопфа при b = 1 + a^2 с возникновением предельного цикла.

