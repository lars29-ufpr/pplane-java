# Predefined Models - Names and Descriptions
model.vanderpol.name=Oscillatore di Van der Pol
model.vanderpol.desc=Oscillatore auto-eccitato con smorzamento non lineare che mostra un ciclo limite di rilassamento stabile.
model.pendulum.name=Pendolo Non Lineare con Attrito
model.pendulum.desc=Moto pendolare con attrito viscoso. Mostra fuochi attrattori e punti di sella in separatrici omocline/eterocline.
model.duffing.name=Oscillatore di Duffing (Autonomo)
model.duffing.desc=Sistema bistabile con un potenziale a doppia buca. Illustra la competizione tra due bacini d''attrazione.
model.lotka.name=Preda-Predatore (Lotka-Volterra)
model.lotka.desc=Modello canonico conservativo preda-predatore. Le traiettorie formano orbite periodiche chiuse nel primo quadrante.
model.murray.name=Competizione a Due Specie (Murray)
model.murray.desc=Modello logistico con termini competitivi incrociati secondo James Murray. A seconda dei parametri, illustra la coesistenza stabile o l''esclusione competitiva.
model.fitzhugh.name=Neurone di FitzHugh-Nagumo
model.fitzhugh.desc=Semplificazione bidimensionale di Hodgkin-Huxley per la dinamica dei potenziali d''azione neuronali e dell''eccitabilità.
model.stommel.name=Circolazione Termoalina di Stommel
model.stommel.desc=Modello a due scatole di Stommel per la convezione oceanica profonda (AMOC). Dimostra bistabilità e punti di non ritorno climatici.
model.kaldor.name=Ciclo Economico Non Lineare di Kaldor
model.kaldor.desc=Dinamica macroeconomica del reddito (Y) e dello stock di capitale (K) con una funzione di investimento non lineare sigmoidale che genera cicli endogeni.
model.sir.name=Epidemia SIR (Kermack-McKendrick)
model.sir.desc=Classico modello epidemiologico di Kermack-McKendrick (1927). Descrive la diffusione di patogeni con immunità permanente in frazioni di popolazione adimensionali (S + I + R = 1).
model.polking_classic.name=Pplane Classico (Polking)
model.polking_classic.desc=Sistema polinomiale dall''apertura del pplane originale MATLAB di John Polking.
model.polking_multiple.name=Polking: Equilibri Multipli
model.polking_multiple.desc=Esempio classico di John Polking (PPLANE/Rice). Presenta 4 punti di equilibrio simultanei, illustrando separatrici e confini dei bacini.
model.strogatz_love.name=Sistemi Lineari 2D (Classificazione e Amore di Strogatz)
model.strogatz_love.desc=Modello lineare di Steven Strogatz per l''affetto reciproco. Mostra orbite a spirale verso l''apatia emozionale o inevitabili cicli di relazioni amorose.
model.brusselator.name=Oscillatore Chimico Brusselator
model.brusselator.desc=Reazione autocatalitica di Prigogine e Lefever. Mostra una biforcazione di Hopf supercritica a b = 1 + a^2 con l''emergere di un ciclo limite.

