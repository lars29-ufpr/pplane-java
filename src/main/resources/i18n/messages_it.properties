# About Dialog
about.window_title=Info su pplaneX
about.description=Analisi e Simulazione del Piano delle Fasi 2D\n\n• Ispirato al classico strumento pplane di John C. Polking.\n• Integrazione numerica adattativa di ODE via Runge-Kutta.\n• Analisi dell'equilibrio locale, autovalori e matrice Jacobiana.\n• Tracciamento interattivo di separatrici, orbite e isocline nulle.\n• Esportazione vettoriale pura (SVG) e raster ad alta risoluzione con canale alfa (PNG RGBA).
