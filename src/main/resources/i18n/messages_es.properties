# Predefined Models - Names and Descriptions
model.vanderpol.name=Oscilador de Van der Pol
model.vanderpol.desc=Oscilador autoexcitado con amortiguamiento no lineal que exhibe un ciclo límite de relajación estable.
model.pendulum.name=Péndulo No Lineal con Fricción
model.pendulum.desc=Movimiento pendular con fricción viscosa. Muestra focos atractores y puntos silla en separatrices homoclínicas/heteroclínicas.
model.duffing.name=Oscilador de Duffing (Autónomo)
model.duffing.desc=Sistema biestable con un potencial de doble pozo. Ilustra la competencia entre dos cuencas de atracción.
model.lotka.name=Depredador-Presa (Lotka-Volterra)
model.lotka.desc=Modelo conservativo canónico de depredador-presa. Las órbitas forman ciclos periódicos cerrados en el primer cuadrante.
model.murray.name=Competencia de Dos Especies (Murray)
model.murray.desc=Modelo logístico con términos competitivos cruzados según James Murray. Dependiendo de los parámetros, ilustra coexistencia estable o exclusión competitiva.
model.fitzhugh.name=Neurona de FitzHugh-Nagumo
model.fitzhugh.desc=Simplificación bidimensional de Hodgkin-Huxley para la dinámica de potenciales de acción neuronales y excitabilidad.
model.stommel.name=Circulación Termohalina de Stommel
model.stommel.desc=Modelo de dos cajas de Stommel para la convección oceánica profunda (AMOC). Demuestra biestabilidad y puntos de inflexión climáticos.
model.kaldor.name=Ciclo Económico No Lineal de Kaldor
model.kaldor.desc=Dinámica macroeconómica del ingreso (Y) y el stock de capital (K) con una función de inversión no lineal sigmoidea que genera ciclos endógenos.
model.sir.name=Epidemia SIR (Kermack-McKendrick)
model.sir.desc=Modelo epidemiológico clásico de Kermack-McKendrick (1927). Describe la propagación de patógenos con inmunidad permanente en fracciones de población adimensionales (S + I + R = 1).
model.polking_classic.name=Pplane Clásico (Polking)
model.polking_classic.desc=Sistema polinomial de la apertura del pplane original de MATLAB de John Polking.
model.polking_multiple.name=Polking: Múltiples Equilibrios
model.polking_multiple.desc=Ejemplo clásico de John Polking (PPLANE/Rice). Presenta 4 puntos de equilibrio simultáneos, ilustrando separatrices y fronteras de cuencas.
model.strogatz_love.name=Sistemas Lineales 2D (Clasificación y Amor de Strogatz)
model.strogatz_love.desc=Modelo lineal de Steven Strogatz para el afecto recíproco. Muestra órbitas en espiral hacia la apatía emocional o ciclos inevitables de relaciones amorosas.
model.brusselator.name=Oscilador Químico Brusselator
model.brusselator.desc=Reacción autocatalítica de Prigogine y Lefever. Exhibe bifurcación de Hopf supercrítica en b = 1 + a^2 con surgimiento de ciclo límite.

