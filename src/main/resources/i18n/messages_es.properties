# About Dialog
about.window_title=Acerca de pplaneX
about.description=Análisis y Simulación de Planos de Fase 2D\n\n• Inspirado en la herramienta clásica pplane de John C. Polking.\n• Integración numérica adaptativa de EDOs vía Runge-Kutta.\n• Análisis de equilibrio local, autovalores y matriz jacobiana.\n• Trazado interactivo de separatrices, órbitas y nulclinas.\n• Exportación vectorial pura (SVG) y rasterización de alta resolución con canal alfa (PNG RGBA).
