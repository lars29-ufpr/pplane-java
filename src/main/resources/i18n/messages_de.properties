# About Dialog
about.window_title=Über pplaneX
about.description=2D Phasenraumanalyse und Simulation\n\n• Inspiriert durch das klassische pplane-Werkzeug von John C. Polking.\n• Adaptive numerische DGL-Integration über Runge-Kutta.\n• Lokale Gleichgewichtsanalyse, Eigenwerte und Jacobi-Matrix.\n• Interaktives Zeichnen von Separatrizen, Bahnen und Nullisoklinen.\n• Sauberer Vektorexport (SVG) und hochauflösendes Raster mit Alphakanal (PNG RGBA).
