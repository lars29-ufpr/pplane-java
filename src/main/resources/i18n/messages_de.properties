# Predefined Models - Names and Descriptions
model.vanderpol.name=Van-der-Pol-Oszillator
model.vanderpol.desc=Selbsterregter Oszillator mit nichtlinearer Dämpfung, der einen stabilen Relaxationsgrenzzyklus aufweist.
model.pendulum.name=Nichtlineares Pendel mit Reibung
model.pendulum.desc=Pendelbewegung mit viskoser Reibung. Zeigt Attraktorfokusse und Sattelpunkte an homoklinen/heteroklinen Separatrizen.
model.duffing.name=Duffing-Oszillator (Autonom)
model.duffing.desc=Bistabiles System mit einem Doppelmuldenpotential. Veranschaulicht den Wettbewerb zwischen zwei Einzugsgebieten.
model.lotka.name=Räuber-Beute (Lotka-Volterra)
model.lotka.desc=Kanonisches konservatives Räuber-Beute-Modell. Trajektorien bilden geschlossene periodische Bahnen im ersten Quadranten.
model.murray.name=Zwei-Arten-Wettbewerb (Murray)
model.murray.desc=Logistisches Modell mit gekreuzten Wettbewerbstermen nach James Murray. Je nach Parameter wird stabile Koexistenz oder Konkurrenzausschluss veranschaulicht.
model.fitzhugh.name=FitzHugh-Nagumo-Neuron
model.fitzhugh.desc=Zweidimensionale Vereinfachung von Hodgkin-Huxley für die Dynamik neuronaler Aktionspotentiale und Erregbarkeit.
model.stommel.name=Stommel Thermohaline Zirkulation
model.stommel.desc=Stommel-Zwei-Box-Modell für tiefe Ozeankonvektion (AMOC). Demonstriert Bistabilität und Klima-Kipppunkte.
model.kaldor.name=Kaldor nichtlinearer Konjunkturzyklus
model.kaldor.desc=Makroökonomische Dynamik von Einkommen (Y) und Kapitalstock (K) mit einer sigmoiden nichtlinearen Investitionsfunktion, die endogene Zyklen erzeugt.
model.sir.name=SIR-Epidemie (Kermack-McKendrick)
model.sir.desc=Klassisches epidemiologisches Kermack-McKendrick-Modell (1927). Beschreibt die Ausbreitung von Krankheitserregern mit permanenter Immunität in dimensionslosen Bevölkerungsanteilen (S + I + R = 1).
model.polking_classic.name=Klassisches Pplane (Polking)
model.polking_classic.desc=Polynomisches System aus der Eröffnung von John Polkings originalem MATLAB-pplane.
model.polking_multiple.name=Polking: Mehrfache Gleichgewichte
model.polking_multiple.desc=Klassisches Beispiel von John Polking (PPLANE/Rice). Weist 4 simultane Gleichgewichtspunkte auf und veranschaulicht Separatrizen und Beckengrenzen.
model.strogatz_love.name=2D-Lineare Systeme (Klassifizierung & Strogatz''s Liebe)
model.strogatz_love.desc=Steven Strogatz''s lineares Modell für gegenseitige Zuneigung. Zeigt Spiralbahnen hin zu emotionaler Apathie oder unvermeidlichen Liebeszyklen.
model.brusselator.name=Brusselator Chemischer Oszillator
model.brusselator.desc=Autokatalytische Reaktion von Prigogine und Lefever. Weist eine superkritische Hopf-Bifurkation bei b = 1 + a^2 mit Entstehung eines Grenzzyklus auf.

