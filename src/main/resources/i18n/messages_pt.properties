model.lotka.name=Predador-Presa (Lotka-Volterra)
model.lotka.desc=Dinâmica populacional clássica entre presas e predadores.
model.murray.name=Competição de Espécies (Murray)
model.murray.desc=Modelo não linear de competição inter-específica.
model.fitzhugh.name=Neurônio de FitzHugh-Nagumo
model.fitzhugh.desc=Modelo simplificado da excitabilidade neuronal.
model.sir.name=Modelo Epidêmico SIR
model.sir.desc=Transmissão de doenças com Suscetíveis, Infectados e Recuperados.

# Modelos da Galeria - Tradução Completa
model.vanderpol.name=Oscilador de Van der Pol
model.vanderpol.desc=Oscilador autoexcitado com amortecimento não linear exibindo ciclo-limite estável de relaxação.
model.pendulum.name=Pêndulo Não Linear com Atrito
model.pendulum.desc=Movimento pendular com atrito viscoso. Apresenta focos atratores e pontos de sela com separatrizes homoclínicas/heteroclínicas.
model.duffing.name=Oscilador de Duffing (Autônomo)
model.duffing.desc=Sistema biestável com potencial de poço duplo. Ilustra a competição entre duas bacias de atração.
model.lotka.name=Predador-Presa (Lotka-Volterra)
model.lotka.desc=Modelo canônico conservativo de presa-predador. As trajetórias formam órbitas periódicas fechadas no primeiro quadrante.
model.murray.name=Competição de Duas Espécies (Murray)
model.murray.desc=Modelo logístico com termos competitivos cruzados segundo James Murray. Ilustra coexistência estável ou exclusão competitiva dependendo dos parâmetros.
model.fitzhugh.name=Neurônio de FitzHugh-Nagumo
model.fitzhugh.desc=Simplificação bidimensional de Hodgkin-Huxley para a dinâmica dos potenciais de ação e excitabilidade neuronal.
model.stommel.name=Circulação Termoalina de Stommel
model.stommel.desc=Modelo de duas caixas de Stommel para convecção oceânica profunda (AMOC). Demonstra biestabilidade e pontos de não retorno climático (tipping points).
model.kaldor.name=Ciclo Econômico Não Linear de Kaldor
model.kaldor.desc=Dinâmica macroeconômica de renda (Y) e estoque de capital (K) com função de investimento não linear sigmoide gerando ciclos endógenos.
model.sir.name=Epidemia SIR (Kermack-McKendrick)
model.sir.desc=Modelo epidemiológico clássico de Kermack-McKendrick (1927). Descreve a disseminação de patógenos com imunidade permanente em frações populacionais adimensionais (S + I + R = 1).
model.polking_classic.name=pplane Clássico (Polking)
model.polking_classic.desc=Sistema polinomial de abertura do pplane original para MATLAB de John Polking.
model.polking_multiple.name=Polking: Múltiplos Equilíbrios
model.polking_multiple.desc=Exemplo clássico de John Polking (PPLANE/Rice). Apresenta 4 pontos de equilíbrio simultâneos, ilustrando separatrizes e fronteiras de bacias.
model.strogatz_love.name=Sistemas Lineares 2D (Classificação & Amor de Strogatz)
model.strogatz_love.desc=Modelo linear de Steven Strogatz para afeição recíproca. Exibe órbitas espirais em direção à apatia emocional ou ciclos inevitáveis de paixão.
model.brusselator.name=Oscilador Químico Brusselator
model.brusselator.desc=Reação autocatalítica de Prigogine e Lefever. Exibe bifurcação de Hopf supercrítica em b = 1 + a^2 com emergência de ciclo-limite.


