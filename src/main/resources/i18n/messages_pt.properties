# About Dialog
about.window_title=Sobre o pplaneX
about.description=Análise e Simulação de Planos de Fase 2D\n\n• Inspirado na ferramenta clássica pplane de John C. Polking.\n• Integração numérica adaptativa de EDOs via Runge-Kutta.\n• Análise local de equilíbrios, autovalores e matriz Jacobiana.\n• Traçado interativo de separatrizes, órbitas e isóclinas nulas.\n• Exportação vetorial pura (SVG) e raster de alta resolução com canal alfa (PNG RGBA).
btn.close=Fechar

