# Относно (Sobre)
about.window_title=Относно pplaneX
about.description=Анализ и симулация на 2D фазови равнини\n\n• Вдъхновено от класическия инструмент pplane на Джон Ч. Полкинг.\n• Адаптивно числено интегриране на ОДУ чрез Рунге-Кута.\n• Локален анализ на равновесия, собствени стойности и матрица на Якоби.\n• Интерактивно изчертаване на сепаратриси, орбити и нулклини.\n• Чисто векторно експортиране (SVG) и растерно с висока резолюция с алфа канал (PNG RGBA).
btn.close=Затваряне
about.version=1.2
about.author=Luiz Antonio Ribeiro de Santana

