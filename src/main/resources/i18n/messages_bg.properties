# Описания на моделите (Model Descriptions)
model.vanderpol.name=Осцилатор на Ван дер Пол
model.vanderpol.desc=Самовъзбуждащ се осцилатор с нелинейно затихване, проявяващ стабилен граничен цикъл на релаксация.
model.pendulum.name=Нелинейно махало с триене
model.pendulum.desc=Движение на махало с вискозно триене. Показва привличащи фокуси и седловини с хомоклинични/хетероклинични сепаратриси.
model.duffing.name=Осцилатор на Дъфинг (Автономен)
model.duffing.desc=Бистабилна система с потенциал с две ямки. Илюстрира конкуренцията между два басейна на привличане.
model.lotka.name=Хищник-Жертва (Лотка-Волтера)
model.lotka.desc=Каноничен консервативен модел на хищник-жертва. Траекториите образуват затворени периодични орбити в първия квадрант.
model.murray.name=Конкуренция на два вида (Мъри)
model.murray.desc=Логистичен модел с кръстосани конкурентни членове според Джеймс Мъри. Илюстрира стабилно съвместно съществуване или конкурентно изключване в зависимост от параметрите.
model.fitzhugh.name=Неврон на Фицхю-Нагумо
model.fitzhugh.desc=Двумерно опростяване на Ходжкин-Хъксли за динамиката на акционните потенциали и невронната възбудимост.
model.stommel.name=Термохалинна циркулация на Стомел
model.stommel.desc=Модел на Стомел с две кутии за дълбока океанска конвекция (AMOC). Демонстрира бистабилност и климатични повратни точки.
model.kaldor.name=Нелинеен икономически цикъл на Калдор
model.kaldor.desc=Макроикономическа динамика на дохода (Y) и капитала (K) със сигмоидална нелинейна инвестиционна функция, генерираща ендогенни цикли.
model.sir.name=Епидемия SIR (Кермак-МакКендрик)
model.sir.desc=Класически епидемиологичен модел на Кермак-МакКендрик (1927). Описва разпространението на патогени с постоянен имунитет в безразмерни популационни фракции (S + I + R = 1).
model.polking_classic.name=Класически pplane (Полкинг)
model.polking_classic.desc=Полиномна система по подразбиране от оригиналния pplane за MATLAB на Джон Полкинг.
model.polking_multiple.name=Полкинг: Множество равновесия
model.polking_multiple.desc=Класически пример от Джон Полкинг (PPLANE/Rice). Представя 4 едновременни точки на равновесие, илюстрирайки сепаратриси и граници на басейни.
model.strogatz_love.name=Линейни системи 2D (Класификация и любов на Строгац)
model.strogatz_love.desc=Линеен модел на Стивън Строгац за взаимна привързаност. Показва спирални орбити към емоционална апатия или неизбежни цикли на страст.
model.brusselator.name=Химически осцилатор Брюселатор
model.brusselator.desc=Автокаталитична реакция на Пригожин и Лефевър. Показва суперкритична бифуркация на Хопф при b = 1 + a^2 с поява на граничен цикъл.

