# Predefined Models - Names and Descriptions
model.vanderpol.name=Van der Pol Oscillator
model.vanderpol.desc=Self-excited oscillator with non-linear damping exhibiting a stable relaxation limit cycle.
model.pendulum.name=Non-Linear Pendulum with Friction
model.pendulum.desc=Pendular motion with viscous friction. Displays attractor foci and saddle points at homoclinic/heteroclinic separatrices.
model.duffing.name=Duffing Oscillator (Autonomous)
model.duffing.desc=Bistable system with a double-well potential. Illustrates the competition between two basins of attraction.
model.lotka.name=Predator-Prey (Lotka-Volterra)
model.lotka.desc=Canonical conservative prey-predator model. Trajectories form closed periodic orbits in the first quadrant.
model.murray.name=Two-Species Competition (Murray)
model.murray.desc=Logistic model with crossed competitive terms per James Murray. Depending on parameters, illustrates stable coexistence or competitive exclusion.
model.fitzhugh.name=FitzHugh-Nagumo Neuron
model.fitzhugh.desc=Two-dimensional simplification of Hodgkin-Huxley for the dynamics of neuronal action potentials and excitability.
model.stommel.name=Stommel Thermohaline Circulation
model.stommel.desc=Stommel two-box model for deep ocean convection (AMOC). Demonstrates bistability and climate tipping points.
model.kaldor.name=Kaldor Non-Linear Business Cycle
model.kaldor.desc=Macroeconomic dynamics of income (Y) and capital stock (K) with a sigmoid non-linear investment function generating endogenous cycles.
model.sir.name=SIR Epidemic (Kermack-McKendrick)
model.sir.desc=Classical Kermack-McKendrick epidemiological model (1927). Describes pathogen spread with permanent immunity in dimensionless population fractions (S + I + R = 1).
model.polking_classic.name=Classical Pplane (Polking)
model.polking_classic.desc=Polynomial system from the opening of John Polking's original MATLAB pplane.
model.polking_multiple.name=Polking: Multiple Equilibria
model.polking_multiple.desc=Classic example from John Polking (PPLANE/Rice). Features 4 simultaneous equilibrium points, illustrating separatrices and basin boundaries.
model.strogatz_love.name=2D Linear Systems (Classification & Strogatz's Love)
model.strogatz_love.desc=Steven Strogatz's linear model for reciprocal affection. Shows spiral orbits toward emotional apathy or inevitable cycles of love affairs.
model.brusselator.name=Brusselator Chemical Oscillator
model.brusselator.desc=Autocatalytic reaction of Prigogine and Lefever. Exhibits supercritical Hopf bifurcation at b = 1 + a^2 with limit-cycle emergence.

