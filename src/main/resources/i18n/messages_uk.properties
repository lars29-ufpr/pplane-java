# Описи моделей (Model Descriptions)
model.vanderpol.name=Осцилятор Ван дер Поля
model.vanderpol.desc=Автоколивальний осцилятор з нелінійним загасанням, що демонструє стійкий граничний цикл релаксації.
model.pendulum.name=Нелінійний маятник з тертям
model.pendulum.desc=Рух маятника з в'язким тертям. Показує притягуючі фокуси та сідла з гомоклінічними/гетероклінічними сепаратрисами.
model.duffing.name=Осцилятор Дуффінга (Автономний)
model.duffing.desc=Бістабільна система з потенціалом з двома ямами. Ілюструє конкуренцію між двома басейнами притягання.
model.lotka.name=Хижак-Жертва (Лотка-Вольтерра)
model.lotka.desc=Канонічна консервативна модель хижак-жертва. Траєкторії утворюють замкнуті періодичні орбіти в першому квадранті.
model.murray.name=Конкуренція двох видів (Мюррей)
model.murray.desc=Логістична модель з перехресними конкурентними доданками за Джеймсом Мюрреєм. Ілюструє стійке співіснування або конкурентне виключення залежно від параметрів.
model.fitzhugh.name=Нейрон ФітцХ'ю-Нагумо
model.fitzhugh.desc=Двовимірне спрощення моделі Ходжкіна-Хакслі для динаміки потенціалів дії та збудливості нейронів.
model.stommel.name=Термохалінна циркуляція Стоммела
model.stommel.desc=Модель Стоммела з двома резервуарами для глибоководної конвекції океану (AMOC). Демонструє бістабільність та кліматичні переломні точки.
model.kaldor.name=Нелінійний економічний цикл Калдора
model.kaldor.desc=Макроекономічна динаміка доходу (Y) та капіталу (K) із сигмоїдальною нелінійною інвестиційною функцією, що генерує ендогенни цикли.
model.sir.name=Епідемія SIR (Кермак-МакКендрік)
model.sir.desc=Класична епідеміологічна модель Кермака-МакКендріка (1927). Описує поширення патогенів зі стійким імунітетом у безрозмірних частках популяції (S + I + R = 1).
model.polking_classic.name=Класичний pplane (Полкінг)
model.polking_classic.desc=Поліноміальна система за замовчуванням з оригінального pplane для MATLAB Джона Полкінга.
model.polking_multiple.name=Полкінг: Множинні рівноваги
model.polking_multiple.desc=Класичний приклад від Джона Полкінга (PPLANE/Rice). Представя 4 одночасні точки рівноваги, ілюструючи сепаратриси та межі басейнів.
model.strogatz_love.name=Лінійні системи 2D (Класифікація та любов Строгаца)
model.strogatz_love.desc=Лінійна модель Стівена Строгаца для взаємної прихильності. Показує спіральні орбіти до емоційної апатії або неминучі цикли пристрасті.
model.brusselator.name=Хімічний осцилятор Брюсселятор
model.brusselator.desc=Автокаталітична реакція Пригожина та Лефевра. Показує надкритичну біфуркацію Хопфа при b = 1 + a^2 з появою граничного циклу.

