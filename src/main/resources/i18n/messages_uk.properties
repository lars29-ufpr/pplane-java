# Про програму (Sobre)
about.window_title=Про pplaneX
about.description=Аналіз та моделювання 2D фазових площин\n\n• Натхненно класичним інструментом pplane Джона Ч. Полкінга.\n• Адаптивне чисельне інтегрування ЗДР методом Рунге-Кутти.\n• Локальний аналіз рівноваг, власних значень та матриці Якобі.\n• Інтерактивна побудова сепаратрис, орбіт та нуль-ізоклін.\n• Чистий векторний експорт (SVG) та растровий високої роздільної здатності з альфа-каналом (PNG RGBA).
btn.close=Закрити
