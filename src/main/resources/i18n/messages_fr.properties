# Predefined Models - Names and Descriptions
model.vanderpol.name=Oscillateur de Van der Pol
model.vanderpol.desc=Oscillateur auto-entretenu avec amortissement non linéaire présentant un cycle limite de relaxation stable.
model.pendulum.name=Pendule Non Linéaire avec Frottement
model.pendulum.desc=Mouvement pendulaire avec frottement visqueux. Affiche des foyers attracteurs et des points cols aux séparatrices homoclines/hétéroclines.
model.duffing.name=Oscillateur de Duffing (Autonome)
model.duffing.desc=Système bistable avec un potentiel à double puits. Illustre la compétition entre deux bassins d'attraction.
model.lotka.name=Proie-Prédateur (Lotka-Volterra)
model.lotka.desc=Modèle canonique conservatif proie-prédateur. Les trajectoires forment des orbites périodiques fermées.
model.murray.name=Compétition entre Deux Espèces (Murray)
model.murray.desc=Modèle logistique avec termes compétitifs croisés. Selon les paramètres, illustre la coexistence stable ou l'exclusion compétitive.
model.fitzhugh.name=Neurone de FitzHugh-Nagumo
model.fitzhugh.desc=Simplification bidimensionnelle de Hodgkin-Huxley pour la dynamique des potentiels d'action neuronaux.
model.stommel.name=Circulation Thermohaline de Stommel
model.stommel.desc=Modèle à deux boîtes de Stommel pour la convection océanique profonde (AMOC). Démontre la bistabilité et les points de basculement climatiques.
model.kaldor.name=Cycle Économique Non Linéaire de Kaldor
model.kaldor.desc=Dynamique macroéconomique du revenu (Y) et du stock de capital (K) générant des cycles endogènes.
model.sir.name=Épidémie SIR (Kermack-McKendrick)
model.sir.desc=Modèle épidémiologique classique (1927). Décrit la propagation de pathogènes avec immunité permanente (S + I + R = 1).
model.polking_classic.name=Pplane Classique (Polking)
model.polking_classic.desc=Système polynomial de l'ouverture du pplane MATLAB original de John Polking.
model.polking_multiple.name=Polking : Équilibres Multiples
model.polking_multiple.desc=Exemple classique de John Polking. Présente 4 points d'équilibre simultanés, illustrant les séparatrices.
model.strogatz_love.name=Systèmes Linéaires 2D (L'Amour selon Strogatz)
model.strogatz_love.desc=Modèle linéaire de Steven Strogatz pour l'affection réciproque. Montre des orbites spirales vers l'apathie émotionnelle ou des cycles inévitables.
model.brusselator.name=Oscillateur Chimique Brusselator
model.brusselator.desc=Réaction autocatalytique de Prigogine et Lefever. Présente une bifurcation de Hopf supercritique avec émergence d'un cycle limite.

