about.description=Analyse et Simulation de Plan de Phase 2D\n\n• Inspiré par l'outil classique pplane de John C. Polking.\n• Intégration numérique adaptative d'EDO via Runge-Kutta.\n• Analyse de l'équilibre local, valeurs propres et matrice jacobienne.\n• Tracé interactif des séparatrices, orbites et nullclines.\n• Export vectoriel pur (SVG) et matriciel haute résolution avec canal alpha (PNG RGBA).
